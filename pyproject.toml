[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexfcl-benchmarks"
version = "1.0.0"
description = "Reproducible DEx-FCL experiments for CICIoT2023 and Edge-IIoTset"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "scipy>=1.11",
  "matplotlib>=3.8", "PyYAML>=6.0", "torch>=2.2", "tqdm>=4.66"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
